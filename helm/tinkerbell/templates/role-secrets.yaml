{{- if .Values.rbac.secrets.enabled }}
{{- range $i, $namespace := include "tinkerbell.roleNamespaces" . | fromJsonArray }}
{{- if $i }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $.Values.rbac.type }}
metadata:
  name: {{ $.Values.rbac.name }}-secrets
  {{- with $namespace }}
  namespace: {{ . | quote }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- end }}
