---
apiVersion: tinkerbell.org/v1alpha2
kind: Workflow
metadata:
  name: example
  namespace: tinkerbell
  annotations:
    tinkerbell.org/disabled: "waiting for hardware readiness"
spec:
  agents:
    - id: "switch-agent-1"
      authentication:
        wireguard:
          publicKey: "q4Hc8Q2rG0b1m9q2Wc7gB2sGq0bR3iX9Uo8nKp1vT0E="
  disabled: false
  globals:
    env:
      globalOne: "1"
    templateMap:
      "globalKey": "value"
      "artifactServer": "{{ .references.mysecret.data.datacenterSpecificURL | b64dec }}"
    volumes:
      - "/etc/data2:/data2:ro"
  references:
    "mysecret":
      group: ""
      name: "secret01"
      resource: "secrets"
      version: "v1"
  tasks:
    - agentID: "switch-agent-1"
      render: "OnCreate"
      taskRef:
        name: "move-switch-port"
      timeoutSeconds: 600
    - bootOptions:
        toggleNetboot: true
        #isoURL: "https://tinkerbell.org/iso/00-01-02-03-04-05/captain.iso"
        #isoURL can be templated, for example:
        #isoURL: 'https://tinkerbell.org/iso/{{ keys .hardware.spec.networkInterfaces | sortAlpha | first | replace ":" "-" }}/captain.iso'
        bootMode: customboot
        customboot:
          preOperations:
            - powerAction: "off"
              timeoutSeconds: 30
            - virtualMediaAction:
                mediaURL: "https://example.com/captain.iso"
                kind: "CD"
              timeoutSeconds: 60
            - bootDevice:
                name: "cdrom" # pxe, disk, bios, cdrom, safe
                persistent: false
                efiBoot: true
            #- networkBootConfig:
            #    pxeBootEnabled: false
            #    httpBootEnabled: true
            #    httpBootURL: "https://example.com/boot/bootx64.efi"
            #    httpBootTLSMode: "OneWay" # None, OneWay
            # Each secureBoot operation sets exactly one field.
            #- secureBoot:
            #    enable: true
            #- secureBoot:
            #    allowCustomKeys: true
            #- secureBoot:
            #    resetKeys:
            #      resetType: "ResetAllKeysToDefault" # ResetAllKeysToDefault, DeleteAllKeys, DeletePK
            #- secureBoot:
            #    databaseResetKeys:
            #      database: "db" # db, KEK, dbx
            #      resetType: "ResetAllKeysToDefault" # ResetAllKeysToDefault, DeleteAllKeys
            #- secureBoot:
            #    certificateImport:
            #      database: "db" # PK, KEK, db, dbx
            #      certificatePEMConfigMapRef:
            #        name: "secure-boot-certs"
            #        key: "db.pem"
            - powerAction: "on" # on, off, soft, status, cycle, reset
          postOperations:
            - powerAction: "off"
              timeoutSeconds: 30
            - virtualMediaAction:
                mediaURL: "" # empty to eject media
                kind: "CD"
            - bootDevice:
                name: "disk"
                persistent: true
                efiBoot: true
            #- networkBootConfig:
            #    pxeBootEnabled: false
            #    httpBootEnabled: false
            #    httpBootURL: "https://example.com/boot/bootx64.efi"
            #    httpBootTLSMode: "None" # None, OneWay
            # Each secureBoot operation sets exactly one field.
            #- secureBoot:
            #    enable: true
            #- secureBoot:
            #    allowCustomKeys: false
            #- secureBoot:
            #    resetKeys:
            #      resetType: "ResetAllKeysToDefault" # ResetAllKeysToDefault, DeleteAllKeys, DeletePK
            #- secureBoot:
            #    databaseResetKeys:
            #      database: "dbx" # db, KEK, dbx
            #      resetType: "ResetAllKeysToDefault" # ResetAllKeysToDefault, DeleteAllKeys
            #- secureBoot:
            #    certificateImport:
            #      database: "db" # PK, KEK, db, dbx
            #      certificatePEMConfigMapRef:
            #        name: "secure-boot-certs"
            #        key: "db.pem"
            - powerAction: "cycle" # on, off, soft, status, cycle, reset
      extra:
        env:
          workflowOne: "1"
        templateMap:
          "workflowKey": "value"
        volumes:
          - "/etc/data3:/data4:ro"
      hardwareRef:
        name: "example"
      render: "OnCheckIn"
      taskRef:
        name: "example"
      timeoutSeconds: 600
  timeoutSeconds: 800
  vars:
    exampleVar: "exampleValue"
