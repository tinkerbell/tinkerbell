---
apiVersion: tinkerbell.org/v1alpha2
kind: Policy
metadata:
  name: example
  namespace: tinkerbell
spec:
  rules:
    workflowAutoCreation:
      - rules:
          - networkInterfaces:
              ports:
                mac: [ { "wildcard": "*" } ]
        config:
          addAttributes: true
          disabled: false
          globals:
            env:
              EXAMPLE_ENV: example_value
            templateMap:
              "exampleKey": value
            volumes:
              - "/etc/data2:/data2:ro"
          references:
            "mysecret":
              name: "secret01"
              resource: "secrets"
              version: "v1"
          timeoutSeconds: 600
          tasks:
            - extra:
                env:
                  TASK_ENV: task_value
                templateMap:
                  "taskKey": value
                volumes:
                  - "/etc/task-data:/data:ro"
              timeoutSeconds: 300
              taskRef:
                name: example
    referenceAccess:
      hardware:
        # all allow rules are combined with a logical OR operation
        allow:
          # Exact match — hardware named exactly "node-01"
          - source:
              name: [ "node-01" ]
            reference:
              group: [ "" ]
              version: [ "v1" ]
              name: [ "my-secret" ]
              resource: [ "secrets" ]

          # Multiple exact matches (OR) — "node-01" or "node-02" or "node-03"
          - source:
              name: [ "node-01", "node-02", "node-03" ]
            reference:
              name: [ "cluster-config" ]
              resource: [ "configmaps" ]

          # Wildcard — any hardware whose name starts with "worker-"
          - source:
              name: [ { "wildcard": "worker-*" } ]
            reference:
              name: [ "worker-credentials" ]
              resource: [ "secrets" ]

          # Prefix — any hardware whose name starts with "prod-"
          - source:
              name: [ { "prefix": "prod-" } ]
            reference:
              resource: [ "secrets" ]

          # Anything-but — any hardware NOT named "control-plane-01"
          - source:
              name: [ { "anything-but": [ "control-plane-01" ] } ]
            reference:
              name: [ "shared-config" ]
              resource: [ "configmaps" ]

          # Equals-ignore-case — case-insensitive resource match for hardware named "node-01"
          - source:
              name: [ "node-01" ]
            reference:
              resource: [ { "equals-ignore-case": "Secrets" } ]

          # Exists — match any hardware that has labels set
          - source:
              labels: [ { "exists": true } ]
            reference:
              name: [ "global-config" ]
              resource: [ "configmaps" ]

          # Mixed — exact values and extended patterns in same array (OR)
          - source:
              name: [ "node-special", { "wildcard": "gpu-*" }, { "prefix": "edge-" } ]
            reference:
              name: [ "gpu-license" ]
              resource: [ "secrets" ]

          # All fields in the source are combined with a logical AND operation
          # This matches if the hardware is named "node-01" with the specified labels
          - source:
              name: [ "node-01" ]
              labels: [ "example-label" , "another-label" ]
            reference:
              name: [ "node-config" ]
              resource: [ "configmaps" ]
        deny:
          - source:
              name: [ "node-01" ]
            reference:
              name: [ "admin-secret" ]
              resource: [ "secrets" ]
      task:
        allow:
          - source:
              name: [ "example-workflow" ]
            reference:
              name: [ "my-secret" ]
              resource: [ "secrets" ]
        deny:
          - source:
              name: [ "example-workflow" ]
            reference:
              name: [ "admin-secret" ]
              resource: [ "secrets" ]
      workflow:
        allow:
          - source:
              name: [ "example-workflow" ]
            reference:
              name: [ "my-secret" ]
              resource: [ "secrets" ]
        deny:
          - source:
              name: [ "example-workflow" ]
            reference:
              name: [ "admin-secret" ]
              resource: [ "secrets" ]
