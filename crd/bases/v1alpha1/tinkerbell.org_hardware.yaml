---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/move: ""
  name: hardware.tinkerbell.org
spec:
  group: tinkerbell.org
  names:
    categories:
    - tinkerbell
    kind: Hardware
    listKind: HardwareList
    plural: hardware
    shortNames:
    - hw
    singular: hardware
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Hardware is the Schema for the Hardware API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HardwareSpec defines the desired state of Hardware.
            properties:
              agentID:
                description: |-
                  AgentID is the unique identifier an Agent uses that is associated with this Hardware.
                  This is used to identify Hardware during the discovery and enrollment process.
                  It is typically the MAC address of the primary network interface.
                type: string
              auto:
                description: Auto is the configuration for the automatic capabilities.
                properties:
                  enrollmentEnabled:
                    default: false
                    description: |-
                      EnrollmentEnabled enables automatic enrollment of the Hardware.
                      When set to true, auto enrollment will create Workflows for this Hardware.
                    type: boolean
                type: object
              bmcRef:
                description: |-
                  BMCRef contains a relation to a BMC state management type in the same
                  namespace as the Hardware. This may be used for BMC management by
                  orchestrators.
                properties:
                  apiGroup:
                    description: |-
                      APIGroup is the group for the resource being referenced.
                      If APIGroup is not specified, the specified Kind must be in the core API group.
                      For any other third-party types, APIGroup is required.
                    type: string
                  kind:
                    description: Kind is the type of resource being referenced
                    type: string
                  name:
                    description: Name is the name of resource being referenced
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-map-type: atomic
              disks:
                items:
                  description: Disk represents a disk device for Tinkerbell Hardware.
                  properties:
                    device:
                      type: string
                  type: object
                type: array
              interfaces:
                items:
                  description: Interface represents configuration related to a network
                    interface.
                  properties:
                    dhcp:
                      description: DHCP configuration.
                      properties:
                        arch:
                          type: string
                        boot_file_name:
                          description: |-
                            BootFileName is the boot file name (DHCP option 67).
                            Used for explicit boot file configuration, required by some network boot clients
                            like NVIDIA NVOS switches.
                            If specified, TFTPServerName must also be specified.
                          type: string
                        classless_static_routes:
                          description: ClasslessStaticRoutes defines static routes
                            to be sent via DHCP option 121 (RFC 3442).
                          items:
                            description: ClasslessStaticRoute represents a classless
                              static route for DHCP option 121 (RFC 3442).
                            properties:
                              destination_descriptor:
                                description: |-
                                  DestinationDescriptor is the network address and prefix length.
                                  The format is "network/prefixlength", e.g., "192.168.1.0/24" or "10.0.0.0/8".
                                pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/(3[0-2]|[12]?[0-9])$
                                type: string
                              router:
                                description: Router is the IP address of the router
                                  for this route.
                                pattern: ^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
                                type: string
                            required:
                            - destination_descriptor
                            - router
                            type: object
                          type: array
                        domain_name:
                          type: string
                        hostname:
                          type: string
                        iface_name:
                          type: string
                        ip:
                          description: IP configuration.
                          properties:
                            address:
                              type: string
                            family:
                              format: int64
                              type: integer
                            gateway:
                              type: string
                            netmask:
                              type: string
                          type: object
                        lease_time:
                          format: int64
                          type: integer
                        mac:
                          pattern: ([0-9a-f]{2}[:]){5}([0-9a-f]{2})
                          type: string
                        name_servers:
                          items:
                            type: string
                          type: array
                        tftp_server_name:
                          description: |-
                            TFTPServerName is the TFTP server name or IP address (DHCP option 66).
                            Used for explicit TFTP server configuration, required by some network boot clients
                            like NVIDIA NVOS switches.
                            If specified, BootFileName must also be specified.
                          type: string
                        time_servers:
                          items:
                            type: string
                          type: array
                        uefi:
                          type: boolean
                        vlan_id:
                          description: validation pattern for VLANDID is a string
                            number between 0-4096
                          pattern: ^(([0-9][0-9]{0,2}|[1-3][0-9][0-9][0-9]|40([0-8][0-9]|9[0-6]))(,[1-9][0-9]{0,2}|[1-3][0-9][0-9][0-9]|40([0-8][0-9]|9[0-6]))*)$
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: TFTPServerName and BootFileName must both be specified
                          or both be empty
                        rule: (has(self.tftp_server_name) && self.tftp_server_name
                          != "") == (has(self.boot_file_name) && self.boot_file_name
                          != "")
                    disableDhcp:
                      default: false
                      description: DisableDHCP disables DHCP for this interface.
                      type: boolean
                    isoboot:
                      description: Isoboot configuration.
                      properties:
                        sourceISO:
                          description: |-
                            SourceISO is the source url where HookOS, an Operating System Installation Environment (OSIE), ISO lives.
                            It must be a valid url.URL{} object and must have a url.URL{}.Scheme of HTTP or HTTPS.
                          format: uri
                          type: string
                      type: object
                    netboot:
                      description: Netboot configuration.
                      properties:
                        allowPXE:
                          type: boolean
                        allowWorkflow:
                          type: boolean
                        ipxe:
                          description: IPXE configuration.
                          properties:
                            binary:
                              description: |-
                                Binary, when defined, overrides Smee's default mapping of architecture to iPXE binary.
                                The following binary names are supported:
                                - undionly.kpxe
                                - ipxe.efi
                                - snp-arm64.efi
                                - snp-x86_64.efi
                                See the iPXE Architecture Mapping documentation for more details.
                              type: string
                            contents:
                              type: string
                            url:
                              type: string
                          type: object
                        osie:
                          description: OSIE (Operating System Installation Environment)
                            configuration.
                          properties:
                            baseURL:
                              type: string
                            initrd:
                              type: string
                            kernel:
                              type: string
                            kernelParams:
                              description: |-
                                KernelParams, when defined, overrides the default kernel parameters passed to the kernel
                                command line when launching the OSIE. Typically they will be in the format "key=value" and
                                align with the Linux Kernel and OSIE documentation, but they can be any string.
                                Also used as the source for RaspberryPi-Netboot cmdline.txt (joined with spaces).
                              items:
                                type: string
                              type: array
                          type: object
                        pxelinux:
                          description: |-
                            PXELINUX represents PXELinux configuration, for u-boot "pxelinux.cfg" booting.
                            It instructs Smee's TFTP server to serve certain files for PXELinux booting.
                            The main pxelinux.cfg asset (in "extlinux" format; see u-boot's distroboot and bootstd docs) is
                            generated on the fly from a config defined in the PXELINUX struct.
                            Other assets (eg, vmlinuz, initramfs, dtb) are served from Smee's configured TFTP asset directory.
                          properties:
                            config:
                              description: |-
                                Config, when defined, overrides the default PXELinux config to use for generating the pxelinux.cfg file.
                                It should be in "extlinux" format, as per u-boot's distroboot and bootstd documentation.
                              type: string
                          type: object
                        rpi:
                          description: |-
                            RPI represents Raspberry Pi network boot configuration.
                            The RaspberryPi's EEPROM firmware can do its own network booting, without u-boot (PXELinux) or iPXE involved.
                            It does so by prefixing requests to certain filenames with the Pi's serial number.
                            Such serial number is NOT related to the MAC address, and is unique to each Pi.
                            The firmware will send requests to "<SerialNum>/start4.elf" to get 2nd-stage firmware, then for
                            "<SerialNum>/config.txt", and "<SerialNum>/cmdline.txt" when doing network booting.
                            config.txt and cmdline.txt will come directly from the Hardware data (config.txt from ConfigTxt; cmdline.txt
                            from the joined OSIE.KernelParams), while everything else (eg all binaries) will be served after a
                            SerialNum -> FirmwarePath mapping.
                            All this depends on being able to find the Hardware via an IP-address lookup; no lookups are done vs the SerialNum.
                            https://www.raspberrypi.com/documentation/computers/raspberry-pi.html#TFTP_PREFIX
                          properties:
                            configTxt:
                              description: |-
                                ConfigTxt, when defined, is served as the Raspberry Pi config.txt file content.
                                When not specified, this route serves no config.txt: the request falls through
                                to any later route, otherwise resulting in a 404.
                              type: string
                            firmwarePath:
                              description: |-
                                FirmwarePath, when defined, overrides the default path to firmware files.
                                This must be coordinated with where Smee serves Raspberry Pi firmware files. See the Smee docs for details.

                                This is an internal URI rewrite. The Raspberry Pi will always request files prefixed with its serial number.
                                This field defines a common backend location for the generic firmware files, which will be used for all other files and binaries.
                                A Raspberry Pi will still request all files from its serial-number prefix, but Smee will serve files from FirmwarePath when the request path starts with the Pi's serial number.
                                For example, if FirmwarePath is set to "rpi-firmware", then a request for "<SerialNum>/start4.elf" will be served from "rpi-firmware/start4.elf" in Smee's asset directory.
                                There are 3 main purposes for this:
                                1. avoid having to duplicate firmware files for each Raspberry Pi.
                                2. allow each Hardware object to specify a different set of firmware files if needed.
                                3. decouple generic firmware files from the, optionally defined, hardware specific config.txt and cmdline.txt files.
                              type: string
                            serialNum:
                              description: |-
                                SerialNum is the Raspberry Pi's serial number.
                                This can be the full serial number or just the last 8 characters.
                                To use any of the fields in the RPI struct, SerialNum must be specified to allow Smee to associate this configuration with the correct Raspberry Pi.
                              type: string
                          required:
                          - serialNum
                          type: object
                      type: object
                  type: object
                type: array
              metadata:
                properties:
                  bonding_mode:
                    format: int64
                    type: integer
                  custom:
                    properties:
                      preinstalled_operating_system_version:
                        properties:
                          distro:
                            type: string
                          image_tag:
                            type: string
                          os_slug:
                            type: string
                          slug:
                            type: string
                          version:
                            type: string
                        type: object
                      private_subnets:
                        items:
                          type: string
                        type: array
                    type: object
                  facility:
                    properties:
                      facility_code:
                        type: string
                      plan_slug:
                        type: string
                      plan_version_slug:
                        type: string
                    type: object
                  instance:
                    properties:
                      allow_pxe:
                        type: boolean
                      always_pxe:
                        type: boolean
                      crypted_root_password:
                        type: string
                      hostname:
                        type: string
                      id:
                        type: string
                      ips:
                        items:
                          properties:
                            address:
                              type: string
                            family:
                              format: int64
                              type: integer
                            gateway:
                              type: string
                            management:
                              type: boolean
                            netmask:
                              type: string
                            public:
                              type: boolean
                          type: object
                        type: array
                      ipxe_script_url:
                        type: string
                      network_ready:
                        type: boolean
                      operating_system:
                        properties:
                          distro:
                            type: string
                          image_tag:
                            type: string
                          os_slug:
                            type: string
                          slug:
                            type: string
                          version:
                            type: string
                        type: object
                      rescue:
                        type: boolean
                      ssh_keys:
                        items:
                          type: string
                        type: array
                      state:
                        type: string
                      storage:
                        properties:
                          disks:
                            items:
                              properties:
                                device:
                                  type: string
                                partitions:
                                  items:
                                    properties:
                                      label:
                                        type: string
                                      number:
                                        format: int64
                                        type: integer
                                      size:
                                        format: int64
                                        type: integer
                                      start:
                                        format: int64
                                        type: integer
                                      type_guid:
                                        type: string
                                    type: object
                                  type: array
                                wipe_table:
                                  type: boolean
                              type: object
                            type: array
                          filesystems:
                            items:
                              properties:
                                mount:
                                  properties:
                                    create:
                                      properties:
                                        force:
                                          type: boolean
                                        options:
                                          items:
                                            type: string
                                          type: array
                                      type: object
                                    device:
                                      type: string
                                    files:
                                      items:
                                        properties:
                                          contents:
                                            type: string
                                          gid:
                                            format: int64
                                            type: integer
                                          mode:
                                            format: int64
                                            type: integer
                                          path:
                                            type: string
                                          uid:
                                            format: int64
                                            type: integer
                                        type: object
                                      type: array
                                    format:
                                      type: string
                                    point:
                                      type: string
                                  type: object
                              type: object
                            type: array
                          raid:
                            items:
                              properties:
                                devices:
                                  items:
                                    type: string
                                  type: array
                                level:
                                  type: string
                                name:
                                  type: string
                                spare:
                                  format: int64
                                  type: integer
                              type: object
                            type: array
                        type: object
                      tags:
                        items:
                          type: string
                        type: array
                      userdata:
                        type: string
                    type: object
                  manufacturer:
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                    type: object
                  state:
                    type: string
                type: object
              references:
                additionalProperties:
                  properties:
                    group:
                      description: |-
                        Group of the referent.
                        More info: https://kubernetes.io/docs/reference/using-api/#api-groups
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    namespace:
                      description: |-
                        Namespace of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                      type: string
                    resource:
                      description: |-
                        Resource of the referent. Must be the pluralized kind of the referent. Must be all lowercase.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    version:
                      description: |-
                        API version of the referent.
                        More info: https://kubernetes.io/docs/reference/using-api/#api-versioning
                      type: string
                  type: object
                description: |-
                  References allows for linking custom resource objects of any kind to this Hardware object.
                  These are available in Templates for templating. They are referenced by the name of the reference.
                  For example, given a reference with the name "lvm", you can access it in a template with .references.lvm.
                type: object
              resources:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: |-
                  Resources represents known resources that are available on a machine.
                  Resources may be used for scheduling by orchestrators.
                type: object
              tinkVersion:
                format: int64
                type: integer
              userData:
                description: |-
                  UserData is the user data to configure in the hardware's
                  metadata
                type: string
              vendorData:
                description: |-
                  VendorData is the vendor data to configure in the hardware's
                  metadata
                type: string
            type: object
          status:
            description: HardwareStatus defines the observed state of Hardware.
            properties:
              attributes:
                description: |-
                  Attributes describes the hardware itself, as observed by Tinkerbell. It is
                  split by collection path rather than merged, so each collector owns a
                  disjoint subtree and neither can clobber the other.
                properties:
                  inBand:
                    description: |-
                      InBand holds attributes reported by the Tink Agent from within the running
                      OS. Only available once the machine has booted and the Agent has checked
                      in; unlike OutOfBand, it cannot see hardware the OS doesn't expose (e.g. the
                      BMC's own firmware, PSUs) but can see hardware the BMC doesn't (e.g. the PCI
                      bus, loaded drivers).
                    properties:
                      baseboard:
                        description: Baseboard describes the mainboard/motherboard.
                        properties:
                          description:
                            type: string
                          firmwareVersion:
                            type: string
                          model:
                            type: string
                          serialNumber:
                            type: string
                          status:
                            description: |-
                              ComponentStatus is health/state information reported for an individual
                              component. PostCode and PostCodeStatus are POST diagnostics and are only
                              meaningful on BIOS.
                            properties:
                              health:
                                type: string
                              postCode:
                                description: |-
                                  PostCode is a pointer because 0 is a meaningful POST code (success), which
                                  omitempty on a value type would drop.
                                format: int32
                                type: integer
                              postCodeStatus:
                                type: string
                              state:
                                type: string
                            type: object
                          vendor:
                            type: string
                        type: object
                      bios:
                        description: BIOS describes the system BIOS firmware.
                        properties:
                          firmwareVersion:
                            type: string
                          model:
                            type: string
                          releaseDate:
                            description: |-
                              ReleaseDate is the BIOS release date as the source reports it, format
                              unspecified (e.g. "12/13/2021"). In-band only.
                            type: string
                          serialNumber:
                            type: string
                          status:
                            description: |-
                              ComponentStatus is health/state information reported for an individual
                              component. PostCode and PostCodeStatus are POST diagnostics and are only
                              meaningful on BIOS.
                            properties:
                              health:
                                type: string
                              postCode:
                                description: |-
                                  PostCode is a pointer because 0 is a meaningful POST code (success), which
                                  omitempty on a value type would drop.
                                format: int32
                                type: integer
                              postCodeStatus:
                                type: string
                              state:
                                type: string
                            type: object
                          vendor:
                            type: string
                        type: object
                      blockDevices:
                        description: BlockDevices lists storage drives.
                        items:
                          description: BlockDevice describes a storage drive.
                          properties:
                            controllerType:
                              type: string
                            driveType:
                              type: string
                            firmwareVersion:
                              type: string
                            model:
                              type: string
                            name:
                              description: Name is the OS-visible device name (e.g.
                                "nvme0n1"). In-band only.
                              type: string
                            physicalBlockSizeBytes:
                              format: int64
                              type: integer
                            serialNumber:
                              type: string
                            sizeBytes:
                              format: int64
                              type: integer
                            smartStatus:
                              description: |-
                                SmartStatus is the drive's self-reported SMART health status (e.g. "ok",
                                "predict-failure"). Out-of-band only.
                              type: string
                            status:
                              description: |-
                                ComponentStatus is health/state information reported for an individual
                                component. PostCode and PostCodeStatus are POST diagnostics and are only
                                meaningful on BIOS.
                              properties:
                                health:
                                  type: string
                                postCode:
                                  description: |-
                                    PostCode is a pointer because 0 is a meaningful POST code (success), which
                                    omitempty on a value type would drop.
                                  format: int32
                                  type: integer
                                postCodeStatus:
                                  type: string
                                state:
                                  type: string
                              type: object
                            vendor:
                              type: string
                            wwn:
                              description: |-
                                WWN is the World Wide Name, a standard unique storage identifier. Where both
                                sources report a drive, this is the key they can be joined on.
                              type: string
                          type: object
                        type: array
                      bmc:
                        description: BMC describes the BMC's own firmware and management
                          NIC. Out-of-band only.
                        properties:
                          firmwareVersion:
                            type: string
                          model:
                            type: string
                          nic:
                            description: |-
                              NIC is the BMC's own management network interface. It is distinct from
                              Attributes.NetworkInterfaces, which lists the host's NICs.
                            properties:
                              firmwareVersion:
                                type: string
                              model:
                                type: string
                              name:
                                description: Name is the OS-visible interface name
                                  (e.g. "eno1"). In-band only.
                                type: string
                              ports:
                                description: |-
                                  Ports lists the physical ports on this adapter. The in-band collector reports
                                  one port per interface; the out-of-band collector groups ports under the
                                  adapter that carries them.
                                items:
                                  description: NetworkPort describes a single physical
                                    port on a network adapter.
                                  properties:
                                    enabledCapabilities:
                                      description: EnabledCapabilities lists enabled
                                        offloads and features. In-band only.
                                      items:
                                        type: string
                                      type: array
                                    linkStatus:
                                      type: string
                                    mac:
                                      description: |-
                                        MAC is the port's hardware address. Where both sources report a port, this is
                                        the key they can be joined on.
                                      type: string
                                    mtu:
                                      format: int32
                                      type: integer
                                    portID:
                                      description: |-
                                        PortID identifies the port as the BMC names it (e.g. "NIC.Embedded.1").
                                        Out-of-band only.
                                      type: string
                                    speedMbps:
                                      format: int32
                                      type: integer
                                  type: object
                                type: array
                              serialNumber:
                                type: string
                              vendor:
                                type: string
                            type: object
                          serialNumber:
                            type: string
                          status:
                            description: |-
                              ComponentStatus is health/state information reported for an individual
                              component. PostCode and PostCodeStatus are POST diagnostics and are only
                              meaningful on BIOS.
                            properties:
                              health:
                                type: string
                              postCode:
                                description: |-
                                  PostCode is a pointer because 0 is a meaningful POST code (success), which
                                  omitempty on a value type would drop.
                                format: int32
                                type: integer
                              postCodeStatus:
                                type: string
                              state:
                                type: string
                            type: object
                          vendor:
                            type: string
                        type: object
                      chassis:
                        description: Chassis describes the enclosure.
                        properties:
                          model:
                            type: string
                          serialNumber:
                            type: string
                          vendor:
                            type: string
                        type: object
                      collectionMethod:
                        description: |-
                          CollectionMethod identifies what produced this subtree: "agent" for in-band,
                          or the bmclib driver for out-of-band (e.g. "redfish", "dell", "supermicro",
                          "asrockrack", "openbmc"). Consumers should use this to interpret absent
                          fields rather than treating them as errors.
                        type: string
                      cpu:
                        description: |-
                          CPU holds aggregate CPU totals and per-socket detail. In-band reports the
                          totals; out-of-band reports the sockets.
                        properties:
                          sockets:
                            description: Sockets lists the individual physical CPUs.
                            items:
                              description: |-
                                CPUSocket describes a single physical CPU. Note: on the out-of-band Redfish
                                collection path, SerialNumber is always empty — that is what the BMC exposes,
                                not a mapping gap.
