---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workflows.tinkerbell.org
spec:
  group: tinkerbell.org
  names:
    categories:
    - tinkerbell
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    shortNames:
    - wf
    singular: workflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.metadata.workflow.state
      name: Workflow State
      type: string
    - jsonPath: .status.metadata.task.name
      name: Task Name
      type: string
    - jsonPath: .status.metadata.action.name
      name: Action Name
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.metadata.task.state
      name: Task State
      priority: 1
      type: string
    - jsonPath: .status.metadata.task.agentID
      name: Task Agent
      priority: 1
      type: string
    - jsonPath: .status.metadata.task.hardware
      name: Task Hardware
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='TemplateRenderedSuccess')].status
      name: Task Rendering
      priority: 1
      type: string
    - jsonPath: .metadata.annotations['tinkerbell.org/disabled']
      name: Disabled
      priority: 1
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          Workflow is the Schema for the Workflow API.
          A Workflow orchestrates one or more Tasks with boot options, hardware references, and templating for provisioning Hardware.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowSpec defines Tasks and associated options.
            properties:
              agents:
                description: |-
                  Agents are Agents that exist only for this Workflow, for Agents without a Hardware object.
                  A Task runs on one of them by naming it in tasks[].agentID.
                items:
                  description: |-
                    WorkflowAgent is an Agent that exists only for a Workflow. Its identity comes from the Workflow
                    rather than a Hardware object.
                  properties:
                    authentication:
                      description: Authentication is how the Agent proves its identity.
                      properties:
                        wireguard:
                          description: Wireguard authenticates the Agent by its WireGuard
                            key.
                          properties:
                            publicKey:
                              description: PublicKey is the Agent's WireGuard public
                                key, base64 encoded.
                              pattern: ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
                              type: string
                          required:
                          - publicKey
                          type: object
                      required:
                      - wireguard
                      type: object
                    id:
                      description: ID is the Agent's ID.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - authentication
                  - id
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              disabled:
                description: |-
                  Disabled pauses the Workflow when set to true, preventing its Tasks from
                  executing. When false or unset, the Workflow runs normally.
                type: boolean
              globals:
                description: Globals are extra configuration that is applied to all
                  Tasks in the Workflow.
                properties:
                  env:
                    additionalProperties:
                      type: string
                    description: Env variables defined here are additive to any existing
                      environment variables.
                    type: object
                  templateMap:
                    additionalProperties:
                      type: string
                    description: TemplateMap is a mapping of key/values that will
                      be used when templating a Task.
                    type: object
                  volumes:
                    description: Volumes defined here are additive to any existing
                      volumes.
                    items:
                      description: "Volume is a specification for mounting a location
                        on a Host into an Action container.\nVolumes take the form
                        {SRC-VOLUME-NAME | SRC-HOST-DIR}:TGT-CONTAINER-DIR:OPTIONS.\nWhen
                        specifying a VOLUME-NAME that does not exist it will be created
                        for you.\nExamples:\n\nRead-only bind mount bound to /data\n\n\t/etc/data:/data:ro\n\nWritable
                        volume name bound to /data\n\n\tshared_volume:/data\n\nSee
                        https://docs.docker.com/storage/volumes/ for additional details."
                      type: string
                    type: array
                type: object
              references:
                additionalProperties:
                  description: Reference identifies an object in the same namespace
                    as the referring object.
                  properties:
                    group:
                      description: |-
                        Group of the referent. Empty means the core API group.
                        More info: https://kubernetes.io/docs/reference/using-api/#api-groups
                      type: string
                    name:
                      description: |-
                        Name of the referent.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                    resource:
                      description: |-
                        Resource of the referent. Must be the pluralized kind of the referent. Must be all lowercase.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    version:
                      description: |-
                        API version of the referent. Templates depend on the referent's schema, so the version is
                        pinned rather than resolved to the cluster's preferred version.
                        More info: https://kubernetes.io/docs/reference/using-api/#api-versioning
                      type: string
                  required:
                  - name
                  - resource
                  - version
                  type: object
                description: |-
                  References are dynamic and defined by the user.
                  These will be available to use in Actions as template dot notation.

                  For example, given the following reference:

                  References:
                    config:
                      name: my-config
                      resource: configmaps
                      version: v1

                  The following Action template string can be used access the reference:

                  {{ .references.config.data.my-key }}
                type: object
              tasks:
                description: Tasks that are run as part of the Workflow.
                items:
                  description: WorkflowTask defines a Task entry within a Workflow,
                    binding a Task definition to an Agent and Hardware.
                  properties:
                    agentID:
                      description: |-
                        AgentID is the ID of the Workflow-scoped Agent, from spec.agents, that runs this Task.
                        Mutually exclusive with HardwareRef.
                      maxLength: 253
                      type: string
                    bootOptions:
                      description: BootOptions are options that control the booting
                        of the Hardware in HardwareRef.
                      properties:
                        bootMode:
                          description: BootMode is the type of booting that will be
                            done. One of "netboot", "isoboot", or "customboot".
                          enum:
                          - netboot
                          - isoboot
                          - customboot
                          type: string
                        customboot:
                          description: |-
                            Customboot is the configuration for the "customboot" boot mode.
                            This allows users to define custom BMC Operations for pre and post a Task.
                          properties:
                            postOperations:
                              description: |-
                                PostOperations are the BMC operations that will be run after all Task Actions have completed.
                                In most cases these operations should get a machine into a state where it can be powered off or rebooted and remove any mounted virtual media.
                                These operations will be run only if all the associated Task Actions complete successfully.
                              items:
                                description: |-
                                  Operations defines the operations that can be performed against a BMC.
                                  Only a single field in the struct should be defined at any given time
                                  as only one operation can be performed at a time.
                                  For example either PowerAction or BootDevice.
                                properties:
                                  bootDevice:
                                    description: BootDevice is the device to set as
                                      the first boot device on the Machine.
                                    properties:
                                      efiBoot:
                                        description: EFIBoot indicates whether the
                                          boot device should be set to efiboot mode.
                                        type: boolean
                                      name:
                                        description: |-
                                          Name is the name of the device to set as the first boot device: a bmclib boot device, such as pxe,
                                          disk, cdrom, usb, usb_cdrom, uefi_http or bios. To boot virtual media, use the device the BMC
                                          presents it as, for example usb_cdrom on some Supermicro, usb on NVIDIA's OpenBMC (GB200) and cdrom
                                          where it is an optical device.
                                        type: string
                                      persistent:
                                        description: Persistent indicates whether
                                          the boot device should be set persistently
                                          as the first boot device.
                                        type: boolean
                                    type: object
                                  networkBootConfig:
                                    description: |-
                                      NetworkBootConfig enables/disables network boot protocol capabilities (UEFI HTTP Boot,
                                      legacy PXE) in BIOS/UEFI firmware, and/or sets the URL UEFI HTTP Boot fetches its boot
                                      image from. Support for the specific BMC vendor is implemented in bmclib.
                                    minProperties: 1
                                    properties:
                                      httpBootEnabled:
                                        description: |-
                                          HTTPBootEnabled enables (true) or disables (false) UEFI HTTP Boot capability, IPv4 and
                                          IPv6 both.
                                        type: boolean
                                      httpBootTLSMode:
                                        description: |-
                                          HTTPBootTLSMode sets the TLS authentication mode UEFI HTTP Boot uses to connect to the HTTP
                                          boot server: "None" allows fetching the boot image over plain HTTP, "OneWay" requires HTTPS
                                          with the server authenticated by the client. Some hardware defaults to "OneWay", which
                                          rejects an HTTPBootURL that isn't HTTPS. Independent of HTTPBootEnabled and HTTPBootURL.
                                        enum:
                                        - None
                                        - OneWay
                                        type: string
                                      httpBootURL:
                                        description: |-
                                          HTTPBootURL sets the URL UEFI HTTP Boot fetches its boot image from, via the standard
                                          Redfish ComputerSystem.Boot.HttpBootUri property. Independent of HTTPBootEnabled: setting
                                          the URL does not enable the capability, and enabling the capability does not require a URL.
                                        format: uri
                                        type: string
                                        x-kubernetes-validations:
                                        - message: httpBootURL must be an http or
                                            https URL
                                          rule: self.startsWith('http://') || self.startsWith('https://')
                                      pxeBootEnabled:
                                        description: PXEBootEnabled enables (true)
                                          or disables (false) legacy PXE boot capability.
                                        type: boolean
                                    type: object
                                  powerAction:
                                    description: PowerAction represents a baseboard
                                      management power operation.
                                    enum:
                                    - "on"
                                    - "off"
                                    - soft
                                    - status
                                    - cycle
                                    - reset
                                    type: string
                                  secureBoot:
                                    description: |-
                                      SecureBoot represents a UEFI Secure Boot operation: enabling or disabling Secure Boot,
                                      resetting its key databases, or importing a certificate into one.
                                    maxProperties: 1
                                    minProperties: 1
                                    properties:
                                      allowCustomKeys:
                                        description: |-
                                          AllowCustomKeys enables (true) or disables (false) the platform's out-of-band acceptance
                                          of custom UEFI Secure Boot keys. This is distinct from enabling Secure Boot itself and
                                          from the standardized Setup/Audit/User/Deployed platform mode: it only gates whether a key
                                          store change made through the BMC will be accepted. Not every BMC supports it; the Task
                                          fails with the provider's error if the BMC doesn't.
                                        type: boolean
                                      certificateImport:
                                        description: CertificateImport imports a certificate
                                          into a single Secure Boot key database.
                                        properties:
                                          certificatePEMConfigMapRef:
                                            description: |-
                                              CertificatePEMConfigMapRef references the key of a ConfigMap, in the namespace of the
                                              Workflow, Job or Task, that holds the PEM-encoded certificate to import. A certificate
                                              isn't secret, but is typically too large and too reused across Workflows to inline
                                              directly into an Action.
                                            properties:
                                              key:
                                                description: Key within the ConfigMap's
                                                  data.
                                                minLength: 1
                                                type: string
                                              name:
                                                description: Name of the ConfigMap.
                                                minLength: 1
                                                type: string
                                            required:
                                            - key
                                            - name
                                            type: object
                                          database:
                                            description: Database is the UEFI Secure
                                              Boot key database to import the certificate
                                              into.
                                            enum:
                                            - PK
                                            - KEK
                                            - db
                                            - dbx
                                            type: string
                                        required:
                                        - certificatePEMConfigMapRef
                                        - database
                                        type: object
                                      databaseResetKeys:
                                        description: DatabaseResetKeys resets a single
                                          Secure Boot key database.
                                        properties:
                                          database:
                                            description: |-
                                              Database is the UEFI Secure Boot key database to reset. PK is not offered; use the
                                              secureBoot resetKeys operation with DeletePK to clear it.
                                            enum:
                                            - db
                                            - KEK
                                            - dbx
                                            type: string
                                          resetType:
                                            description: |-
                                              ResetType is the type of key reset to perform: ResetAllKeysToDefault restores the
                                              database to its platform default, DeleteAllKeys empties it.
                                            enum:
                                            - ResetAllKeysToDefault
                                            - DeleteAllKeys
                                            type: string
                                        required:
                                        - database
                                        - resetType
                                        type: object
                                      enable:
                                        description: Enable enables (true) or disables
                                          (false) UEFI Secure Boot.
                                        type: boolean
                                      resetKeys:
                                        description: |-
                                          ResetKeys resets the Secure Boot key databases as a whole, PK included, as opposed to
                                          DatabaseResetKeys which targets a single database other than PK.
                                        properties:
                                          resetType:
                                            description: |-
                                              ResetType is the type of key reset to perform: ResetAllKeysToDefault restores every
                                              database to its platform default, DeleteAllKeys empties every database including PK, and
                                              DeletePK empties only PK. DeleteAllKeys and DeletePK both put the firmware in Setup Mode.
                                            enum:
                                            - ResetAllKeysToDefault
                                            - DeleteAllKeys
                                            - DeletePK
                                            type: string
                                        required:
                                        - resetType
                                        type: object
                                    type: object
                                  timeoutSeconds:
                                    description: |-
                                      TimeoutSeconds defines the maximum time in seconds the Operation is allowed to run.
                                      If not defined, the default from the runtime is used.
                                    format: int64
                                    type: integer
                                  virtualMediaAction:
                                    description: VirtualMediaAction represents a baseboard
                                      management virtual media insert/eject.
                                    properties:
                                      kind:
                                        description: Kind represents the kind of virtual
                                          media.
                                        type: string
                                      mediaURL:
                                        description: mediaURL represents the URL of
                                          the image to be inserted into the virtual
                                          media, or empty to eject media.
                                        type: string
                                    required:
                                    - kind
                                    type: object
                                type: object
                                x-kubernetes-validations:
                                - message: exactly one of powerAction, bootDevice,
                                    virtualMediaAction, networkBootConfig, or secureBoot
                                    must be specified
                                  rule: '(has(self.powerAction) ? 1 : 0) + (has(self.bootDevice)
                                    ? 1 : 0) + (has(self.virtualMediaAction) ? 1 :
                                    0) + (has(self.networkBootConfig) ? 1 : 0) + (has(self.secureBoot)
                                    ? 1 : 0) == 1'
                              maxItems: 32
                              type: array
                            preOperations:
                              description: |-
                                PreOperations are the BMC operations that will be run before any Task Actions.
                                In most cases these operations should get a machine into a state where a Tink Agent is running.
                              items:
                                description: |-
                                  Operations defines the operations that can be performed against a BMC.
                                  Only a single field in the struct should be defined at any given time
                                  as only one operation can be performed at a time.
                                  For example either PowerAction or BootDevice.
                                properties:
                                  bootDevice:
                                    description: BootDevice is the device to set as
                                      the first boot device on the Machine.
                                    properties:
                                      efiBoot:
                                        description: EFIBoot indicates whether the
                                          boot device should be set to efiboot mode.
                                        type: boolean
                                      name:
                                        description: |-
                                          Name is the name of the device to set as the first boot device: a bmclib boot device, such as pxe,
                                          disk, cdrom, usb, usb_cdrom, uefi_http or bios. To boot virtual media, use the device the BMC
                                          presents it as, for example usb_cdrom on some Supermicro, usb on NVIDIA's OpenBMC (GB200) and cdrom
                                          where it is an optical device.
                                        type: string
                                      persistent:
                                        description: Persistent indicates whether
                                          the boot device should be set persistently
                                          as the first boot device.
                                        type: boolean
                                    type: object
                                  networkBootConfig:
                                    description: |-
                                      NetworkBootConfig enables/disables network boot protocol capabilities (UEFI HTTP Boot,
                                      legacy PXE) in BIOS/UEFI firmware, and/or sets the URL UEFI HTTP Boot fetches its boot
                                      image from. Support for the specific BMC vendor is implemented in bmclib.
                                    minProperties: 1
                                    properties:
                                      httpBootEnabled:
                                        description: |-
                                          HTTPBootEnabled enables (true) or disables (false) UEFI HTTP Boot capability, IPv4 and
                                          IPv6 both.
                                        type: boolean
                                      httpBootTLSMode:
                                        description: |-
                                          HTTPBootTLSMode sets the TLS authentication mode UEFI HTTP Boot uses to connect to the HTTP
                                          boot server: "None" allows fetching the boot image over plain HTTP, "OneWay" requires HTTPS
                                          with the server authenticated by the client. Some hardware defaults to "OneWay", which
                                          rejects an HTTPBootURL that isn't HTTPS. Independent of HTTPBootEnabled and HTTPBootURL.
                                        enum:
                                        - None
                                        - OneWay
                                        type: string
                                      httpBootURL:
                                        description: |-
                                          HTTPBootURL sets the URL UEFI HTTP Boot fetches its boot image from, via the standard
                                          Redfish ComputerSystem.Boot.HttpBootUri property. Independent of HTTPBootEnabled: setting
                                          the URL does not enable the capability, and enabling the capability does not require a URL.
                                        format: uri
                                        type: string
                                        x-kubernetes-validations:
                                        - message: httpBootURL must be an http or
                                            https URL
                                          rule: self.startsWith('http://') || self.startsWith('https://')
                                      pxeBootEnabled:
                                        description: PXEBootEnabled enables (true)
                                          or disables (false) legacy PXE boot capability.
                                        type: boolean
                                    type: object
                                  powerAction:
                                    description: PowerAction represents a baseboard
                                      management power operation.
                                    enum:
                                    - "on"
                                    - "off"
                                    - soft
                                    - status
                                    - cycle
                                    - reset
                                    type: string
                                  secureBoot:
                                    description: |-
                                      SecureBoot represents a UEFI Secure Boot operation: enabling or disabling Secure Boot,
                                      resetting its key databases, or importing a certificate into one.
                                    maxProperties: 1
                                    minProperties: 1
                                    properties:
                                      allowCustomKeys:
                                        description: |-
                                          AllowCustomKeys enables (true) or disables (false) the platform's out-of-band acceptance
                                          of custom UEFI Secure Boot keys. This is distinct from enabling Secure Boot itself and
                                          from the standardized Setup/Audit/User/Deployed platform mode: it only gates whether a key
                                          store change made through the BMC will be accepted. Not every BMC supports it; the Task
                                          fails with the provider's error if the BMC doesn't.
                                        type: boolean
                                      certificateImport:
                                        description: CertificateImport imports a certificate
                                          into a single Secure Boot key database.
                                        properties:
                                          certificatePEMConfigMapRef:
                                            description: |-
                                              CertificatePEMConfigMapRef references the key of a ConfigMap, in the namespace of the
                                              Workflow, Job or Task, that holds the PEM-encoded certificate to import. A certificate
                                              isn't secret, but is typically too large and too reused across Workflows to inline
                                              directly into an Action.
                                            properties:
                                              key:
                                                description: Key within the ConfigMap's
                                                  data.
                                                minLength: 1
                                                type: string
                                              name:
                                                description: Name of the ConfigMap.
                                                minLength: 1
                                                type: string
                                            required:
                                            - key
                                            - name
                                            type: object
                                          database:
                                            description: Database is the UEFI Secure
                                              Boot key database to import the certificate
                                              into.
                                            enum:
                                            - PK
                                            - KEK
                                            - db
                                            - dbx
                                            type: string
                                        required:
                                        - certificatePEMConfigMapRef
                                        - database
                                        type: object
                                      databaseResetKeys:
                                        description: DatabaseResetKeys resets a single
                                          Secure Boot key database.
                                        properties:
                                          database:
                                            description: |-
                                              Database is the UEFI Secure Boot key database to reset. PK is not offered; use the
                                              secureBoot resetKeys operation with DeletePK to clear it.
                                            enum:
                                            - db
                                            - KEK
                                            - dbx
                                            type: string
                                          resetType:
                                            description: |-
                                              ResetType is the type of key reset to perform: ResetAllKeysToDefault restores the
                                              database to its platform default, DeleteAllKeys empties it.
                                            enum:
                                            - ResetAllKeysToDefault
                                            - DeleteAllKeys
                                            type: string
                                        required:
                                        - database
                                        - resetType
                                        type: object
                                      enable:
                                        description: Enable enables (true) or disables
                                          (false) UEFI Secure Boot.
                                        type: boolean
                                      resetKeys:
                                        description: |-
                                          ResetKeys resets the Secure Boot key databases as a whole, PK included, as opposed to
                                          DatabaseResetKeys which targets a single database other than PK.
                                        properties:
                                          resetType:
                                            description: |-
                                              ResetType is the type of key reset to perform: ResetAllKeysToDefault restores every
                                              database to its platform default, DeleteAllKeys empties every database including PK, and
                                              DeletePK empties only PK. DeleteAllKeys and DeletePK both put the firmware in Setup Mode.
                                            enum:
                                            - ResetAllKeysToDefault
                                            - DeleteAllKeys
                                            - DeletePK
                                            type: string
                                        required:
                                        - resetType
                                        type: object
                                    type: object
                                  timeoutSeconds:
                                    description: |-
                                      TimeoutSeconds defines the maximum time in seconds the Operation is allowed to run.
                                      If not defined, the default from the runtime is used.
                                    format: int64
                                    type: integer
                                  virtualMediaAction:
                                    description: VirtualMediaAction represents a baseboard
                                      management virtual media insert/eject.
                                    properties:
                                      kind:
                                        description: Kind represents the kind of virtual
                                          media.
                                        type: string
                                      mediaURL:
                                        description: mediaURL represents the URL of
                                          the image to be inserted into the virtual
                                          media, or empty to eject media.
                                        type: string
                                    required:
                                    - kind
                                    type: object
                                type: object
                                x-kubernetes-validations:
                                - message: exactly one of powerAction, bootDevice,
                                    virtualMediaAction, networkBootConfig, or secureBoot
                                    must be specified
                                  rule: '(has(self.powerAction) ? 1 : 0) + (has(self.bootDevice)
                                    ? 1 : 0) + (has(self.virtualMediaAction) ? 1 :
                                    0) + (has(self.networkBootConfig) ? 1 : 0) + (has(self.secureBoot)
                                    ? 1 : 0) == 1'
                              maxItems: 32
                              type: array
                          type: object
                        isoURL:
                          description: |-
                            ISOURL is the URL of the ISO that will be one-time booted.
                            When this field is set, a job.bmc.tinkerbell.org object will be created
                            for getting the associated Hardware into a CDROM booting state.
                            HardwareRef must name a Hardware that has a bmc.
                            BootMode must be set to "isoboot".
                          format: uri
                          type: string
                        toggleNetboot:
                          description: |-
                            ToggleNetboot indicates whether the the field in the associated Hardware for allowing network booting should
                            be enabled before the Task is executed and disabled after the Task has completed successfully.
                            HardwareRef must be set.
                          type: boolean
                      type: object
                    extra:
                      description: Extra configuration that is applied to this specific
                        Task.
                      properties:
                        env:
                          additionalProperties:
                            type: string
                          description: Env variables defined here are additive to
                            any existing environment variables.
                          type: object
                        templateMap:
                          additionalProperties:
                            type: string
                          description: TemplateMap is a mapping of key/values that
                            will be used when templating a Task.
                          type: object
                        volumes:
                          description: Volumes defined here are additive to any existing
                            volumes.
                          items:
                            description: "Volume is a specification for mounting a
                              location on a Host into an Action container.\nVolumes
                              take the form {SRC-VOLUME-NAME | SRC-HOST-DIR}:TGT-CONTAINER-DIR:OPTIONS.\nWhen
                              specifying a VOLUME-NAME that does not exist it will
                              be created for you.\nExamples:\n\nRead-only bind mount
                              bound to /data\n\n\t/etc/data:/data:ro\n\nWritable volume
                              name bound to /data\n\n\tshared_volume:/data\n\nSee
                              https://docs.docker.com/storage/volumes/ for additional
                              details."
                            type: string
                          type: array
                      type: object
                    hardwareRef:
                      description: |-
                        HardwareRef is the Hardware this Task is for. The Task runs on the Hardware's Agent,
                        templates read the Hardware as .hardware, and BootOptions boot it.
                        Mutually exclusive with AgentID.
                      properties:
                        name:
                          description: Name of the object.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    render:
                      default: OnCreate
                      description: |-
                        Render picks when the Task is rendered. OnCheckIn renders the Task, along with the
                        Hardware and Workflow it reads, when the Task's Agent checks in.
                      enum:
                      - OnCreate
                      - OnCheckIn
                      type: string
                    taskRef:
                      description: |-
                        TaskRef is the Task associated with this Workflow.
                        Omit it for a Task that only runs boot operations.
                      properties:
                        name:
                          description: Name of the object.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    timeoutSeconds:
                      description: |-
                        TimeoutSeconds is the duration before a Task time out is reached.
                        A zero or nil value means no timeout.
                      format: int64
                      type: integer
                  type: object
                  x-kubernetes-validations:
