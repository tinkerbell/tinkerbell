---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  labels:
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/move: ""
  name: hardware.tinkerbell.org
spec:
  group: tinkerbell.org
  names:
    categories:
    - tinkerbell
    kind: Hardware
    listKind: HardwareList
    plural: hardware
    shortNames:
    - hw
    singular: hardware
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.annotations['tinkerbell.org/disabled']
      name: Disabled
      priority: 1
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Hardware is the Schema for the Hardware API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HardwareSpec defines the desired state of Hardware.
            properties:
              agent:
                properties:
                  authentication:
                    description: Authentication
                    properties:
                      tpm:
                        properties:
                          ekPublicKeyHash:
                            type: string
                        type: object
                      wireguard:
                        properties:
                          publicKey:
                            type: string
                        type: object
                    type: object
                  id:
                    description: |-
                      ID is the unique identifier an Agent uses that is associated with this Hardware.
                      This is used to identify Hardware during the discovery and enrollment process.
                      It is typically the MAC address of the primary network interface.
                    type: string
                type: object
              arch:
                description: |-
                  Arch represents the Hardware's architecture type.
                  For example: x86_64, amd64, aarch64, arm64, etc.
                type: string
              auto:
                description: Auto is the configuration for the automatic capabilities.
                properties:
                  enrollmentEnabled:
                    description: |-
                      EnrollmentEnabled enables automatic enrollment of the Hardware.
                      When set to true, auto enrollment will create Workflows for this Hardware.
                      Unset is equivalent to false.
                    type: boolean
                type: object
              bmc:
                description: BMC contains connection and configuration data for the
                  BMC (Baseboard Management Controller) of this Hardware.
                properties:
                  bootMode:
                    default: UEFI
                    description: |-
                      BootMode specifies the firmware boot mode of the Hardware.
                      One of UEFI or BIOS.
                    enum:
                    - UEFI
                    - BIOS
                    type: string
                  connection:
                    description: Connection contains connection data for a Baseboard
                      Management Controller.
                    properties:
                      credentialsRef:
                        description: |-
                          CredentialsRef is the Secret object that contains credentials for authenticating to the BMC.
                          The Secret must contain username and password keys.
                          This is optional as it is not required when using the RPC provider.
                        properties:
                          name:
                            description: Name of the object.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      host:
                        description: Host is the IP address or hostname of the BMC.
                        minLength: 1
                        type: string
                      insecureTLS:
                        description: |-
                          InsecureTLS indicates whether to skip TLS certificate verification when connecting to the BMC.
                          Unset is equivalent to false.
                        type: boolean
                      providerOptions:
                        description: ProviderOptions contains provider specific options.
                        properties:
                          homeAssistant:
                            description: HomeAssistant contains the options to customize
                              the HomeAssistant provider.
                            properties:
                              powerOperationDelaySeconds:
                                description: PowerOperationDelaySeconds is the number
                                  of seconds to wait after a power operation before
                                  proceeding
                                format: int32
                                minimum: 0
                                type: integer
                              switchEntityID:
                                description: SwitchEntityID is the entity ID of the
                                  Home Assistant switch entity to control power state
                                type: string
                            required:
                            - switchEntityID
                            type: object
                          intelAMT:
                            description: IntelAMT contains the options to customize
                              the IntelAMT provider.
                            properties:
                              hostScheme:
                                default: http
                                description: HostScheme determines whether to use
                                  http or https for intelAMT calls.
                                enum:
                                - http
                                - https
                                type: string
                              port:
                                description: Port that intelAMT will use for calls.
                                format: int32
                                type: integer
                            type: object
                          ipmitool:
                            description: IPMITOOL contains the options to customize
                              the Ipmitool provider.
                            properties:
                              cipherSuite:
                                description: CipherSuite that ipmitool will use for
                                  calls.
                                type: string
                              port:
                                description: Port that ipmitool will use for calls.
                                format: int32
                                type: integer
                            type: object
                          preferredOrder:
                            description: |-
                              PreferredOrder allows customizing the order that BMC providers are called.
                              Providers added to this list will be moved to the front of the default order.
                              Provider names are case insensitive.
                              The default order is: ipmitool, asrockrack, gofish, intelamt, dell, supermicro, openbmc.
                            items:
                              description: ProviderName is the bmclib specific provider
                                name. Names are case insensitive.
                              pattern: (?i)^(ipmitool|asrockrack|gofish|IntelAMT|dell|supermicro|openbmc)$
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          redfish:
                            description: Redfish contains the options to customize
                              the Redfish provider.
                            properties:
                              etagMatchDisabled:
                                description: |-
                                  EtagMatchDisabled stops the redfish provider from sending a resource's ETag in an If-Match header
                                  on PATCH and POST requests. Some BMC implementations reject a request whose If-Match doesn't
                                  match the ETag they expect, with 412 Precondition Failed, even when the ETag came from a read just before.
                                  Unset is equivalent to false.
                                type: boolean
                              port:
                                description: Port that redfish will use for calls.
                                format: int32
                                type: integer
                              systemName:
                                description: |-
                                  SystemName is the name of the system to use for redfish calls.
                                  With redfish implementations that manage multiple systems via a single endpoint, this allows for specifying the system to manage.
                                type: string
                              useBasicAuth:
                                description: |-
                                  UseBasicAuth for redfish calls. The default is false which means token based auth is used.
                                  Unset is equivalent to false.
                                type: boolean
                            type: object
                          rpc:
                            description: RPC contains the options to customize the
                              RPC provider.
                            properties:
                              consumerURL:
                                description: |-
                                  ConsumerURL is the URL where an rpc consumer/listener is running
                                  and to which we will send and receive all notifications.
                                type: string
                              experimental:
                                description: Experimental options.
                                properties:
                                  customRequestPayload:
                                    description: CustomRequestPayload must be in json.
                                    type: string
                                  dotPath:
                                    description: 'DotPath is the path to the json
                                      object where the bmclib RequestPayload{} struct
                                      will be embedded. For example: object.data.body'
                                    type: string
                                type: object
                              hmac:
                                description: HMAC is the options used to create a
                                  HMAC signature.
                                properties:
                                  algorithmPrefixDisabled:
                                    description: |-
                                      AlgorithmPrefixDisabled determines whether the algorithm will be prefixed to the signature. Example: sha256=abc123
                                      Unset is equivalent to false.
                                    type: boolean
                                  secrets:
                                    additionalProperties:
                                      items:
                                        description: SimpleReference identifies an
                                          object by name in the same namespace as
                                          the referring object.
                                        properties:
                                          name:
                                            description: Name of the object.
                                            minLength: 1
                                            type: string
                                        required:
                                        - name
                                        type: object
                                      type: array
                                    description: Secrets are a map of algorithms to
                                      secrets used for signing.
                                    type: object
                                type: object
                              logNotificationsDisabled:
                                description: |-
                                  LogNotificationsDisabled determines whether responses from rpc consumer/listeners will be logged or not.
                                  Unset is equivalent to false.
                                type: boolean
                              request:
                                description: Request is the options used to create
                                  the rpc HTTP request.
                                properties:
                                  httpContentType:
                                    description: HTTPContentType is the content type
                                      to use for the rpc request notification.
                                    type: string
                                  httpMethod:
                                    description: HTTPMethod is the HTTP method to
                                      use for the rpc request notification.
                                    type: string
                                  staticHeaders:
                                    additionalProperties:
                                      items:
                                        type: string
                                      type: array
                                    description: StaticHeaders are predefined headers
                                      that will be added to every request.
                                    type: object
                                  timestampFormat:
                                    description: TimestampFormat is the time format
                                      for the timestamp header.
                                    type: string
                                  timestampHeader:
                                    description: 'TimestampHeader is the header name
                                      that should contain the timestamp. Example:
                                      X-BMCLIB-Timestamp'
                                    type: string
                                type: object
                              signature:
                                description: Signature is the options used for adding
                                  an HMAC signature to an HTTP request.
                                properties:
                                  appendAlgorithmToHeaderDisabled:
                                    description: |-
                                      AppendAlgorithmToHeaderDisabled decides whether to append the algorithm to the signature header or not.
                                      Example: X-BMCLIB-Signature becomes X-BMCLIB-Signature-256
                                      When set to true, a header will be added for each algorithm. Example: X-BMCLIB-Signature-256 and X-BMCLIB-Signature-512
                                      Unset is equivalent to false.
                                    type: boolean
                                  headerName:
                                    description: 'HeaderName is the header name that
                                      should contain the signature(s). Example: X-BMCLIB-Signature'
                                    type: string
                                  includedPayloadHeaders:
                                    description: |-
                                      IncludedPayloadHeaders are headers whose values will be included in the signature payload. Example: X-BMCLIB-My-Custom-Header
                                      All headers will be deduplicated.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                type: object
                            required:
                            - consumerURL
                            type: object
                        type: object
                    required:
                    - host
                    type: object
                type: object
              instance:
                description: Instance describes data that is less permanent than any
                  physical attributes of the Hardware.
                properties:
                  lookupID:
                    description: |-
                      LookupID is an identifier used by the metadata service (Tootles) to route incoming requests
                      to this Hardware object. This is the value that must appear in the NoCloud seedfrom URL path
                      or the EC2 metadata endpoint path for Tootles to match the request to this Hardware.

                      This field is required when using bring-your-own DHCP (BYO DHCP), where IP-based lookup is
                      not available. The value must match whatever identifier will appear in the request URL.
                      For example, if cloud-init is configured with:

                        ds=nocloud;s=http://tootles:8080/nocloud/<lookupID>/

                      then this field must be set to the same <lookupID> value. When using DMI variable expansion
                      (e.g., __dmi.chassis-serial-number__), this field must match the machine's actual DMI value.

                      This field does not support templating. The value is stored and indexed as-is.
                    type: string
                  metadata:
                    description: |-
                      Metadata is data following the cloud-init NoCloud datasource for meta-data.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#meta-data

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  networkConfig:
                    description: |-
                      NetworkConfig is config following the cloud-init NoCloud datasource for network configuration.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#network-config

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  osie:
                    description: OSIE (Operating System Installation Environment)
                      configuration.
                    properties:
                      files:
                        description: Files, when defined, is the set of additional
                          files to be made available to the OSIE (Operating System
                          Installation Environment).
                        items:
                          description: |-
                            OSIEFile represents a file to be made available to the OSIE (Operating System Installation Environment).
                            All files are relative to the default /osie_files directory in the OSIE (Operating System Installation Environment).
                          properties:
                            contents:
                              description: Contents is the contents of the file.
                              type: string
                            mode:
                              description: |-
                                Mode is the file's permission bits as an octal string, e.g. "0644", "644" or "0o644".
                                Only permission bits are allowed (max "0777"); setuid, setgid and sticky bits are rejected.
                                Symbolic forms like "rw-r--r--" and decimal values are invalid.
                                Omitted or "0" means the default, "0400" (read-only for the owner).
                              maxLength: 8
                              pattern: ^(0[oO])?0*[0-7]{1,3}$
                              type: string
                            path:
                              description: |-
                                Path is the file path where the file should be made available within the default /osie_files directory in the OSIE (Operating System Installation Environment).
                                A leading "/" is ignored. Empty, "." and ".." segments are not allowed.
                              maxLength: 255
                              pattern: ^/?[^/]+(/[^/]+)*$
                              type: string
                              x-kubernetes-validations:
                              - message: path must not contain '.' or '..' segments
                                rule: '!self.split(''/'').exists(s, s == ''.'' ||
                                  s == ''..'')'
                          required:
                          - path
                          type: object
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: atomic
                        x-kubernetes-validations:
                        - message: osieFiles paths must be unique
                          rule: 'self.all(a, self.exists_one(b, (b.path.startsWith(''/'')
                            ? b.path.substring(1) : b.path) == (a.path.startsWith(''/'')
                            ? a.path.substring(1) : a.path)))'
                        - message: an osieFiles path must not be the parent directory
                            of another
                          rule: 'self.all(a, !self.exists(b, (b.path.startsWith(''/'')
                            ? b.path.substring(1) : b.path).startsWith((a.path.startsWith(''/'')
                            ? a.path.substring(1) : a.path) + ''/'')))'
                      initrdURL:
                        description: InitrdURL, when defined, overrides the default
                          initrd URL.
                        type: string
                      isoURL:
                        description: |-
                          ISOURL, when defined, overrides is the default source URL where the Operating System Installation Environment (OSIE) ISO lives.
                          It must be a valid URL and must have a Scheme of HTTP or HTTPS.
                        type: string
                        x-kubernetes-validations:
                        - message: isoURL must be a valid http or https URL
                          rule: self == '' || (isURL(self) && url(self).getScheme()
                            in ['http','https'])
                      kernelParams:
                        description: |-
                          KernelParams, when defined, overrides the default kernel parameters passed to the kernel command line when launching the OSIE.
                          Typically they will be in the format "key=value" and align with the Linux Kernel
                          and OSIE documentation, but they can be any string.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      kernelURL:
                        description: KernelURL, when defined, overrides the default
                          URL to a kernel image.
                        type: string
                    type: object
                  sshKeys:
                    description: SSHKeys are public SSH keys associated with this
                      Hardware.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  userData:
                    description: |-
                      UserData is data following the cloud-init NoCloud datasource for user-data.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#user-data

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  vars:
                    additionalProperties:
                      type: string
                    description: Vars are custom variables that can be filled with
                      arbitrary key-value pairs.
                    type: object
                  vendorData:
                    description: |-
                      VendorData is data following the cloud-init NoCloud datasource for vendor-data.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#vendor-data

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  workflowsDisabled:
                    description: |-
                      WorkflowsDisabled, when true, prevents Workflows that reference this Hardware from running.
                      Unset is equivalent to false.
                    type: boolean
                type: object
              networkInterfaces:
                additionalProperties:
                  description: NetworkInterface is the desired configuration for a
                    particular network interface.
                  properties:
                    dhcp:
                      description: DHCP is the DHCP configuration for this interface.
                      properties:
                        ipv4:
                          description: IPv4 is the options for serving dhcpv4 requests.
                          properties:
                            disabled:
                              description: |-
                                Disabled indicates that DHCPv4 should not be served for this interface.
                                When true, no DHCPv4 offer or ack will be sent for this MAC address.
                                Unset is equivalent to false.
                              type: boolean
                            leaseTimeSeconds:
                              default: 604800
                              description: |-
                                LeaseTimeSeconds is the lease time to serve. DHCP option 51.
                                The maximum is the largest uint32, as defined by RFC 2132 § 9.2
                                (https://www.rfc-editor.org/rfc/rfc2132.html#section-9.2).
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                          type: object
                        ipv6:
                          description: IPv6 is the options for serving dhcpv6 requests.
                          properties:
                            disabled:
                              description: |-
                                Disabled indicates that DHCPv6 should not be served for this interface.
                                When true, no DHCPv6 responses will be sent for this MAC address.
                                Unset is equivalent to false.
                              type: boolean
                            informationRefreshTimeSeconds:
                              description: |-
                                InformationRefreshTimeSeconds is the upper bound in seconds for how long a client should wait
                                before refreshing information retrieved from DHCPv6. DHCPv6 option 32 (RFC 9915 §21.23).
                                Included in replies to Information-Request messages. RFC 9915 sets the minimum at 600 seconds.
                              format: int64
                              maximum: 4294967295
                              minimum: 600
                              type: integer
                            preferredLifetimeSeconds:
                              description: |-
                                PreferredLifetimeSeconds is the preferred lifetime in seconds for IPv6 addresses
                                assigned via IA_NA. Included in replies to Solicit/Request messages.
                                It must not exceed the valid lifetime. 4294967295 basically means infinity.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                            validLifetimeSeconds:
                              default: 604800
                              description: |-
                                ValidLifetimeSeconds is the valid lifetime in seconds for IPv6 addresses
                                assigned via IA_NA. Included in replies to Solicit/Request messages.
                                4294967295 basically means infinity.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                          type: object
                          x-kubernetes-validations:
                          - message: preferredLifetimeSeconds must not exceed validLifetimeSeconds
                            rule: '!has(self.preferredLifetimeSeconds) || !has(self.validLifetimeSeconds)
                              || self.preferredLifetimeSeconds <= self.validLifetimeSeconds'
                      type: object
                    ipam:
                      description: IPAM is the IP address management for this interface.
                      properties:
                        hostname:
                          description: |-
                            Hostname is served as DHCPv4 option 12 and DHCPv6 option 39. Must be a valid hostname or
                            fully qualified domain name as defined by RFC 1123.
                          maxLength: 253
                          pattern: ^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$
                          type: string
                        ipv4:
                          description: IPv4 is the IPv4 address and associated network
                            info.
                          properties:
                            address:
                              description: Address is the unique network address.
                              maxLength: 45
                              type: string
                            classlessStaticRoutes:
                              description: ClasslessStaticRoutes defines static routes
                                to be sent via DHCP option 121 (RFC 3442) or for DHCPv6
                                these will be available for statically being configured.
                              items:
                                description: |-
                                  ClasslessStaticRoute represents a classless static route for DHCP option 121 (RFC 3442) (IPv4)
                                  or a static route exposed alongside DHCPv6 configuration for client-side configuration (IPv6).
                                  The IP family of DestinationDescriptor and Router must match the parent IPAM field
                                  (ipv4 or ipv6) they are nested under. This is enforced by CEL validation on the IPAM struct.
                                properties:
                                  destinationDescriptor:
                                    description: |-
                                      DestinationDescriptor is the network address and prefix length in CIDR form,
                                      e.g., "192.168.1.0/24" or "2001:db8::/64". Must be a valid IPv4 or IPv6 CIDR;
                                      the family must match the enclosing IPAM field (ipv4 or ipv6).
                                    maxLength: 49
                                    type: string
                                  router:
                                    description: |-
                                      Router is the IP address of the router for this route. Must be a valid IPv4 or IPv6
                                      address; the family must match the enclosing IPAM field (ipv4 or ipv6).
                                    maxLength: 45
                                    type: string
                                required:
                                - destinationDescriptor
                                - router
                                type: object
                              maxItems: 32
                              type: array
                              x-kubernetes-list-type: atomic
                            domainSearchList:
                              description: DomainSearchList to serve via DHCPv6 option
                                24 (RFC 3646) and DHCPv4 option 15 (or 119) (RFC 3397).
                                They must be listed in order of priority.
                              items:
                                type: string
                              maxItems: 32
                              type: array
                              x-kubernetes-list-type: atomic
                            gateway:
                              description: |-
                                Gateway is the default gateway address. It is served as DHCPv4 option 3. DHCPv6 cannot serve a
                                default gateway, as that comes from Router Advertisements, so for IPv6 it is only available for static configuration.
                              maxLength: 45
                              type: string
                            nameservers:
                              description: Nameservers to serve as DHCPv4 option 6
                                (RFC 2132) or DHCPv6 option 23 (RFC 3646).
                              items:
                                description: Nameserver is an IP address of the family
                                  of the enclosing IPAM field (ipv4 or ipv6).
                                maxLength: 45
                                type: string
                              maxItems: 10
                              type: array
                              x-kubernetes-list-type: atomic
                            ntpServers:
                              description: NTPServers to serve as DHCPv4 option 42
                                (RFC 2132 §8.3) or DHCPv6 option 56 (RFC 5908).
                              items:
                                description: Timeserver is an IP address of the family
                                  of the enclosing IPAM field (ipv4 or ipv6).
                                maxLength: 45
                                type: string
                              maxItems: 10
                              type: array
                              x-kubernetes-list-type: atomic
                            prefix:
                              description: |-
                                Prefix is the subnet prefix length, for example 24 for an IPv4 /24 or 64 for an IPv6 /64.
                                It is required for an IPv4 address and must be at most 32 for IPv4. DHCPv6 cannot serve a
                                prefix length, as that comes from Router Advertisements, so for IPv6 it is only available for static configuration.
                              format: int32
                              maximum: 128
                              minimum: 1
                              type: integer
                          type: object
                        ipv6:
                          description: IPv6 is the IPv6 address and associated network
                            info.
                          properties:
                            address:
                              description: Address is the unique network address.
                              maxLength: 45
                              type: string
                            classlessStaticRoutes:
                              description: ClasslessStaticRoutes defines static routes
                                to be sent via DHCP option 121 (RFC 3442) or for DHCPv6
                                these will be available for statically being configured.
                              items:
                                description: |-
                                  ClasslessStaticRoute represents a classless static route for DHCP option 121 (RFC 3442) (IPv4)
                                  or a static route exposed alongside DHCPv6 configuration for client-side configuration (IPv6).
