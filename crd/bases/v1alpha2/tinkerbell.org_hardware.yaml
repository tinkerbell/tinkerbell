---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    clusterctl.cluster.x-k8s.io: ""
    clusterctl.cluster.x-k8s.io/move: ""
  name: hardware.tinkerbell.org
spec:
  group: tinkerbell.org
  names:
    categories:
    - tinkerbell
    kind: Hardware
    listKind: HardwareList
    plural: hardware
    shortNames:
    - hw
    singular: hardware
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.annotations['tinkerbell.org/disabled']
      name: Disabled
      priority: 1
      type: string
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Hardware is the Schema for the Hardware API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HardwareSpec defines the desired state of Hardware.
            properties:
              agentID:
                description: |-
                  AgentID is the unique identifier an Agent uses that is associated with this Hardware.
                  This is used to identify Hardware during the discovery and enrollment process.
                  It is typically the MAC address of the primary network interface.
                type: string
              arch:
                description: |-
                  Arch represents the Hardware's architecture type.
                  For example: x86_64, amd64, aarch64, arm64, etc.
                type: string
              auto:
                description: Auto is the configuration for the automatic capabilities.
                properties:
                  enrollmentEnabled:
                    default: false
                    description: |-
                      EnrollmentEnabled enables automatic enrollment of the Hardware.
                      When set to true, auto enrollment will create Workflows for this Hardware.
                    type: boolean
                type: object
              bmc:
                description: BMC contains connection and configuration data for the
                  BMC (Baseboard Management Controller) of this Hardware.
                properties:
                  bootMode:
                    default: UEFI
                    description: |-
                      BootMode specifies the firmware boot mode of the Hardware.
                      One of UEFI or BIOS.
                    enum:
                    - UEFI
                    - BIOS
                    type: string
                  connection:
                    description: Connection contains connection data for a Baseboard
                      Management Controller.
                    properties:
                      credentialsRef:
                        description: |-
                          CredentialsRef is the Secret object that contains credentials for authenticating to the BMC.
                          The Secret must contain username and password keys.
                          This is optional as it is not required when using the RPC provider.
                        properties:
                          name:
                            description: Name of the object.
                            type: string
                          namespace:
                            description: Namespace in which the object resides.
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                        x-kubernetes-validations:
                        - message: name and namespace must both be non-empty or both
                            be empty
                          rule: (self.name != "") == (self.namespace != "")
                      host:
                        description: Host is the IP address or hostname of the BMC.
                        minLength: 1
                        type: string
                      insecureTLS:
                        description: InsecureTLS indicates whether to skip TLS certificate
                          verification when connecting to the BMC.
                        type: boolean
                      providerOptions:
                        description: ProviderOptions contains provider specific options.
                        properties:
                          intelAMT:
                            description: IntelAMT contains the options to customize
                              the IntelAMT provider.
                            properties:
                              hostScheme:
                                default: http
                                description: HostScheme determines whether to use
                                  http or https for intelAMT calls.
                                enum:
                                - http
                                - https
                                type: string
                              port:
                                description: Port that intelAMT will use for calls.
                                type: integer
                            type: object
                          ipmitool:
                            description: IPMITOOL contains the options to customize
                              the Ipmitool provider.
                            properties:
                              cipherSuite:
                                description: CipherSuite that ipmitool will use for
                                  calls.
                                type: string
                              port:
                                description: Port that ipmitool will use for calls.
                                type: integer
                            type: object
                          preferredOrder:
                            description: |-
                              PreferredOrder allows customizing the order that BMC providers are called.
                              Providers added to this list will be moved to the front of the default order.
                              Provider names are case insensitive.
                              The default order is: ipmitool, asrockrack, gofish, intelamt, dell, supermicro, openbmc.
                            items:
                              description: ProviderName is the bmclib specific provider
                                name. Names are case insensitive.
                              pattern: (?i)^(ipmitool|asrockrack|gofish|IntelAMT|dell|supermicro|openbmc)$
                              type: string
                            type: array
                          redfish:
                            description: Redfish contains the options to customize
                              the Redfish provider.
                            properties:
                              port:
                                description: Port that redfish will use for calls.
                                type: integer
                              systemName:
                                description: |-
                                  SystemName is the name of the system to use for redfish calls.
                                  With redfish implementations that manage multiple systems via a single endpoint, this allows for specifying the system to manage.
                                type: string
                              useBasicAuth:
                                description: UseBasicAuth for redfish calls. The default
                                  is false which means token based auth is used.
                                type: boolean
                            type: object
                          rpc:
                            description: RPC contains the options to customize the
                              RPC provider.
                            properties:
                              consumerURL:
                                description: |-
                                  ConsumerURL is the URL where an rpc consumer/listener is running
                                  and to which we will send and receive all notifications.
                                type: string
                              experimental:
                                description: Experimental options.
                                properties:
                                  customRequestPayload:
                                    description: CustomRequestPayload must be in json.
                                    type: string
                                  dotPath:
                                    description: 'DotPath is the path to the json
                                      object where the bmclib RequestPayload{} struct
                                      will be embedded. For example: object.data.body'
                                    type: string
                                type: object
                              hmac:
                                description: HMAC is the options used to create a
                                  HMAC signature.
                                properties:
                                  prefixSigDisabled:
                                    description: 'PrefixSigDisabled determines whether
                                      the algorithm will be prefixed to the signature.
                                      Example: sha256=abc123'
                                    type: boolean
                                  secrets:
                                    additionalProperties:
                                      items:
                                        description: SimpleReference is used to reference
                                          an object.
                                        properties:
                                          name:
                                            description: Name of the object.
                                            type: string
                                          namespace:
                                            description: Namespace in which the object
                                              resides.
                                            type: string
                                        required:
                                        - name
                                        - namespace
                                        type: object
                                        x-kubernetes-validations:
                                        - message: name and namespace must both be
                                            non-empty or both be empty
                                          rule: (self.name != "") == (self.namespace
                                            != "")
                                      type: array
                                    description: Secrets are a map of algorithms to
                                      secrets used for signing.
                                    type: object
                                type: object
                              logNotificationsDisabled:
                                description: LogNotificationsDisabled determines whether
                                  responses from rpc consumer/listeners will be logged
                                  or not.
                                type: boolean
                              request:
                                description: Request is the options used to create
                                  the rpc HTTP request.
                                properties:
                                  httpContentType:
                                    description: HTTPContentType is the content type
                                      to use for the rpc request notification.
                                    type: string
                                  httpMethod:
                                    description: HTTPMethod is the HTTP method to
                                      use for the rpc request notification.
                                    type: string
                                  staticHeaders:
                                    additionalProperties:
                                      items:
                                        type: string
                                      type: array
                                    description: StaticHeaders are predefined headers
                                      that will be added to every request.
                                    type: object
                                  timestampFormat:
                                    description: TimestampFormat is the time format
                                      for the timestamp header.
                                    type: string
                                  timestampHeader:
                                    description: 'TimestampHeader is the header name
                                      that should contain the timestamp. Example:
                                      X-BMCLIB-Timestamp'
                                    type: string
                                type: object
                              signature:
                                description: Signature is the options used for adding
                                  an HMAC signature to an HTTP request.
                                properties:
                                  appendAlgoToHeaderDisabled:
                                    description: |-
                                      AppendAlgoToHeaderDisabled decides whether to append the algorithm to the signature header or not.
                                      Example: X-BMCLIB-Signature becomes X-BMCLIB-Signature-256
                                      When set to true, a header will be added for each algorithm. Example: X-BMCLIB-Signature-256 and X-BMCLIB-Signature-512
                                    type: boolean
                                  headerName:
                                    description: 'HeaderName is the header name that
                                      should contain the signature(s). Example: X-BMCLIB-Signature'
                                    type: string
                                  includedPayloadHeaders:
                                    description: |-
                                      IncludedPayloadHeaders are headers whose values will be included in the signature payload. Example: X-BMCLIB-My-Custom-Header
                                      All headers will be deduplicated.
                                    items:
                                      type: string
                                    type: array
                                type: object
                            required:
                            - consumerURL
                            type: object
                        type: object
                    required:
                    - host
                    type: object
                type: object
              instance:
                description: Instance describes data that is less permanent than any
                  physical attributes of the Hardware.
                properties:
                  lookupID:
                    description: |-
                      LookupID is an identifier used by the metadata service (Tootles) to route incoming requests
                      to this Hardware object. This is the value that must appear in the NoCloud seedfrom URL path
                      or the EC2 metadata endpoint path for Tootles to match the request to this Hardware.

                      This field is required when using bring-your-own DHCP (BYO DHCP), where IP-based lookup is
                      not available. The value must match whatever identifier will appear in the request URL.
                      For example, if cloud-init is configured with:

                        ds=nocloud;s=http://tootles:8080/nocloud/<lookupID>/

                      then this field must be set to the same <lookupID> value. When using DMI variable expansion
                      (e.g., __dmi.chassis-serial-number__), this field must match the machine's actual DMI value.

                      This field does not support templating. The value is stored and indexed as-is.
                    type: string
                  metadata:
                    description: |-
                      Metadata is data following the cloud-init NoCloud datasource for meta-data.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#meta-data

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  networkConfig:
                    description: |-
                      NetworkConfig is config following the cloud-init NoCloud datasource for network configuration.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#network-config

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  osie:
                    description: OSIE (Operating System Installation Environment)
                      configuration.
                    properties:
                      initrdURL:
                        description: InitrdURL, when defined, overrides the default
                          initrd URL.
                        type: string
                      isoURL:
                        description: |-
                          ISOURL, when defined, overrides is the default source URL where the Operating System Installation Environment (OSIE) ISO lives.
                          It must be a valid URL and must have a Scheme of HTTP or HTTPS.
                        type: string
                        x-kubernetes-validations:
                        - message: isoURL must be a valid http or https URL
                          rule: self == '' || (isURL(self) && url(self).getScheme()
                            in ['http','https'])
                      kernelParams:
                        description: |-
                          KernelParams, when defined, overrides the default kernel parameters passed to the kernel command line when launching the OSIE.
                          Typically they will be in the format "key=value" and align with the Linux Kernel
                          and OSIE documentation, but they can be any string.
                        items:
                          type: string
                        type: array
                      kernelURL:
                        description: KernelURL, when defined, overrides the default
                          URL to a kernel image.
                        type: string
                    type: object
                  sshKeys:
                    description: SSHKeys are public SSH keys associated with this
                      Hardware.
                    items:
                      type: string
                    type: array
                  userdata:
                    description: |-
                      Userdata is data following the cloud-init NoCloud datasource for user-data.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#user-data

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                  vars:
                    additionalProperties:
                      type: string
                    description: Vars are custom variables that can be filled with
                      arbitrary key-value pairs.
                    type: object
                  vendordata:
                    description: |-
                      Vendordata is data following the cloud-init NoCloud datasource for vendor-data.

                      https://cloudinit.readthedocs.io/en/latest/reference/datasources/nocloud.html#vendor-data

                      This string can be templated with values from the Hardware object by using the
                      standard Go templating format, https://pkg.go.dev/text/template.
                      Always start with ".hardware", then use dot notation to the desired key.

                      {{ .hardware.location.to.a.key.in.the.spec }}

                      For example:
                      Reference the first ssh key in the list:
                      {{ .hardware.instance.sshKeys[0] }}

                      or

                      Reference the IPv4 address of a network interface:
                      {{ (index .hardware.networkInterfaces "52:54:00:41:05:c6").ipam.ipv4.address }}
                    type: string
                type: object
              networkInterfaces:
                additionalProperties:
                  description: NetworkInterface is the desired configuration for a
                    particular network interface.
                  properties:
                    dhcp:
                      description: DHCP is the DHCP configuration for this interface.
                      properties:
                        ipv4:
                          description: IPv4 is the options for serving dhcpv4 requests.
                          properties:
                            disabled:
                              description: |-
                                Disabled indicates that DHCPv4 should not be served for this interface.
                                When true, no DHCPv4 offer or ack will be sent for this MAC address.
                              type: boolean
                            leaseTimeSeconds:
                              default: 86400
                              description: |-
                                LeaseTimeSeconds to serve. 24h default. Maximum equates to max uint32 as defined by RFC 2132
                                § 9.2 (https://www.rfc-editor.org/rfc/rfc2132.html#section-9.2). DHCP option 51.
                              format: int64
                              maximum: 4294967295
                              minimum: 0
                              type: integer
                          type: object
                          x-kubernetes-validations:
                          - message: TFTPServerName and BootFileName must both be
                              specified or both be empty
                            rule: (has(self.tftpServerName) && self.tftpServerName
                              != "") == (has(self.bootFileName) && self.bootFileName
                              != "")
                        ipv6:
                          description: IPv6 is the options for serving dhcpv6 requests.
                          properties:
                            disabled:
                              description: |-
                                Disabled indicates that DHCPv6 should not be served for this interface.
                                When true, no DHCPv6 responses will be sent for this MAC address.
                              type: boolean
                            informationRefreshTime:
                              description: |-
                                InformationRefreshTime is the upper bound in seconds for how long a client should wait
                                before refreshing information retrieved from DHCPv6. DHCPv6 option 32 (RFC 8415 §21.23).
                                Included in replies to Information-Request messages.
                              format: int64
                              minimum: 0
                              type: integer
                            preferredLifetime:
                              description: |-
                                PreferredLifetime is the preferred lifetime in seconds for IPv6 addresses
                                assigned via IA_NA. Included in replies to Solicit/Request messages.
                              format: int64
                              minimum: 0
                              type: integer
                            validLifetime:
                              description: |-
                                ValidLifetime is the valid lifetime in seconds for IPv6 addresses
                                assigned via IA_NA. Included in replies to Solicit/Request messages.
                              format: int64
                              minimum: 0
                              type: integer
                          type: object
                      type: object
                    ipam:
                      description: IPAM is the IP address management for this interface.
                      properties:
                        ipv4:
                          description: IPv4 is the IPv4 address and associated network
                            info.
                          properties:
                            address:
                              description: Address is the unique network address.
                              maxLength: 45
                              type: string
                            classlessStaticRoutes:
                              description: ClasslessStaticRoutes defines static routes
                                to be sent via DHCP option 121 (RFC 3442) or for DHCPv6
                                these will be available for statically being configured.
                              items:
                                description: |-
                                  ClasslessStaticRoute represents a classless static route for DHCP option 121 (RFC 3442) (IPv4)
                                  or a static route exposed alongside DHCPv6 configuration for client-side configuration (IPv6).
                                  The IP family of DestinationDescriptor and Router must match the parent IPAM field
                                  (ipv4 or ipv6) they are nested under. This is enforced by CEL validation on the IPAM struct.
                                properties:
                                  destinationDescriptor:
                                    description: |-
                                      DestinationDescriptor is the network address and prefix length in CIDR form,
                                      e.g., "192.168.1.0/24" or "2001:db8::/64". Must be a valid IPv4 or IPv6 CIDR;
                                      the family must match the enclosing IPAM field (ipv4 or ipv6).
                                    type: string
                                  router:
                                    description: |-
                                      Router is the IP address of the router for this route. Must be a valid IPv4 or IPv6
                                      address; the family must match the enclosing IPAM field (ipv4 or ipv6).
                                    type: string
                                required:
                                - destinationDescriptor
                                - router
                                type: object
                              type: array
                            domainSearchList:
                              description: DomainSearchList to serve via DHCPv6 option
                                24 (RFC 3646) and DHCPv4 option 15 (or 119) (RFC 3397).
                                They must be listed in order of priority.
                              items:
                                type: string
                              maxItems: 32
                              type: array
                            gateway:
                              description: Gateway is the default gateway address
                                to serve.
                              maxLength: 45
                              type: string
                            hostname:
                              description: Hostname is DHCPv4 option 12 and DHCPv6
                                option 39. Must be a valid hostname as defined by
                                RFC 952 and RFC 1123.
                              pattern: ^([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9])$
                              type: string
                            nameservers:
                              description: Nameservers to serve for both DHCPv6 option
                                23 (RFC 3646) and DHCPv4 option 6 (RFC 2132). Must
                                be valid IPv6 or IPv4 addresses.
                              items:
                                description: Nameserver is an IPv4 address, IPv6 address,
                                  or hostname.
                                maxLength: 253
                                pattern: ^(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]*[a-zA-Z0-9])\.)*([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9\-]*[A-Za-z0-9])$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$|^(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:))$
                                type: string
                              maxItems: 10
                              type: array
                            ntpServers:
                              description: NTPServers corresponding to DHCPv4 option
                                42 (RFC 2132 §8.3) or DHCPv6 option 56 (RFC 5908).
                                Must be valid IPv6 or IPv4 addresses.
                              items:
                                description: Timeserver is an IPv4 address, IPv6 address,
                                  or hostname.
                                maxLength: 253
                                pattern: ^(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]*[a-zA-Z0-9])\.)*([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9\-]*[A-Za-z0-9])$|^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$|^(([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:))$
                                type: string
                              maxItems: 10
                              type: array
                            prefix:
                              description: Prefix is the subnet length.
                              maxLength: 3
                              type: string
                            vlanID:
                              description: VLANID is a VLAN ID between 0 and 4096.
                                DHCP option 43 suboption 116.
                              pattern: ^(([0-9][0-9]{0,2}|[1-3][0-9][0-9][0-9]|40([0-8][0-9]|9[0-6]))(,[1-9][0-9]{0,2}|[1-3][0-9][0-9][0-9]|40([0-8][0-9]|9[0-6]))*)$
                              type: string
                          type: object
                        ipv6:
                          description: IPv6 is the IPv6 address and associated network
                            info.
                          properties:
                            address:
                              description: Address is the unique network address.
                              maxLength: 45
                              type: string
                            classlessStaticRoutes:
                              description: ClasslessStaticRoutes defines static routes
                                to be sent via DHCP option 121 (RFC 3442) or for DHCPv6
                                these will be available for statically being configured.
                              items:
                                description: |-
                                  ClasslessStaticRoute represents a classless static route for DHCP option 121 (RFC 3442) (IPv4)
                                  or a static route exposed alongside DHCPv6 configuration for client-side configuration (IPv6).
                                  The IP family of DestinationDescriptor and Router must match the parent IPAM field
                                  (ipv4 or ipv6) they are nested under. This is enforced by CEL validation on the IPAM struct.
                                properties:
                                  destinationDescriptor:
                                    description: |-
                                      DestinationDescriptor is the network address and prefix length in CIDR form,
                                      e.g., "192.168.1.0/24" or "2001:db8::/64". Must be a valid IPv4 or IPv6 CIDR;
                                      the family must match the enclosing IPAM field (ipv4 or ipv6).
                                    type: string
                                  router:
                                    description: |-
                                      Router is the IP address of the router for this route. Must be a valid IPv4 or IPv6
                                      address; the family must match the enclosing IPAM field (ipv4 or ipv6).
                                    type: string
                                required:
                                - destinationDescriptor
                                - router
                                type: object
                              type: array
                            domainSearchList:
                              description: DomainSearchList to serve via DHCPv6 option
                                24 (RFC 3646) and DHCPv4 option 15 (or 119) (RFC 3397).
                                They must be listed in order of priority.
                              items:
                                type: string
                              maxItems: 32
                              type: array
                            gateway:
