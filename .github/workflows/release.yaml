name: Release
# Runs for each release tag: checks the tag, validates, builds from a cold
# cache, publishes and signs the images and the Helm chart, attests the
# embedded binaries and their SBOMs, and drafts the GitHub release. What it
# signs and attests carries the identity
# .github/workflows/release.yaml@refs/tags/<tag>, which
# docs/technical/VERIFYING_ARTIFACTS.md tells users to check.
#
# Artifacts carry binaries between jobs, but any job in the run can replace an
# artifact. Only a job can set its own outputs, so the jobs that publish, sign
# or attest use the checksums and digests other jobs output, never what came
# with a download.
on:
  push:
    tags:
      - "v**"

# Jobs that publish declare the extra permissions they need. A job-level
# block replaces this one, so it must also grant contents (read or write).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CGO_ENABLED: 0

# Actions, here and in .github/actions, are pinned by commit SHA, with the
# version in a comment, so a moved tag cannot change what runs next to the
# publishing and signing credentials. Dependabot updates the pins.
jobs:
  # Checks the tag before anything is published, and decides the version to
  # publish (script/publish-version.sh).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # A release tag must point to a commit on main. The tag ruleset controls
      # who can push a tag, not which commit it points to.
      - name: Check that the tagged commit is on main
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Decide the version to publish
        id: version
        run: ./script/publish-version.sh

  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up the Go build
        uses: ./.github/actions/setup-go-build
        with:
          cache-name: validation

      - name: Run all CI checks, linting, tests, etc
        run: make ci TEST_ARGS="-count=1"

  validate-helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: install helm
        uses: Azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Lint and test Helm chart
        run: make helm-lint helm-test

  build:
    uses: ./.github/workflows/build.yaml

  publish:
    permissions:
      contents: read
      packages: write
    needs:
      - version
      - validation
      - validate-helm-chart
      - build
    uses: ./.github/workflows/publish.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      sha256sums-tinkerbell: ${{ needs.build.outputs.sha256sums-tinkerbell }}
      sha256sums-tink-agent: ${{ needs.build.outputs.sha256sums-tink-agent }}

  # Holds the OIDC token that signs as this workflow. It runs checkout and the
  # sign action (cosign-installer and cosign, plus jq and docker buildx
  # imagetools from the runner image), and signs only digests from outputs.
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign pushes the signatures next to the images and the chart.
      packages: write
      # Keyless cosign signing: the job's OIDC token identifies the workflow.
      id-token: write
    needs:
      - publish
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign the images and the Helm chart
        uses: ./.github/actions/sign
        with:
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          digest-tinkerbell: ${{ needs.publish.outputs.digest-tinkerbell }}
          digest-tink-agent: ${{ needs.publish.outputs.digest-tink-agent }}
          digest-chart: ${{ needs.publish.outputs.digest-chart }}

  # Generates the embedded binaries' SBOMs and outputs their checksums, so the
  # job holding the OIDC token runs no third-party tooling.
  sbom-binaries:
    runs-on: ubuntu-latest
    needs:
      - build
    outputs:
      sha256sums: ${{ steps.checksums.outputs.sha256sums }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the embedded binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: embedded-*-binaries
          path: ./out
          merge-multiple: true

      # Before syft parses them.
      - name: Check the binaries against the build
        run: ./script/checksums.sh out/checksums-embedded.txt "${SHA256SUMS_AMD64}" "${SHA256SUMS_ARM64}"
        env:
          SHA256SUMS_AMD64: ${{ needs.build.outputs.sha256sums-embedded-amd64 }}
          SHA256SUMS_ARM64: ${{ needs.build.outputs.sha256sums-embedded-arm64 }}

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      # syft reads the Go module list embedded in each binary.
      - name: Generate SBOMs
        run: |
          for binary in tinkerbell-embedded-linux-amd64 tinkerbell-embedded-linux-arm64; do
            "${SYFT}" scan "file:out/${binary}" -o "spdx-json=out/${binary}.spdx.json"
          done
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"

      # Base64 keeps the sha256sum lines on one line.
      - name: Record the checksums
        id: checksums
        working-directory: out
        run: |
          sums=$(sha256sum tinkerbell-embedded-linux-amd64.spdx.json tinkerbell-embedded-linux-arm64.spdx.json)
          b64=$(base64 --wrap=0 <<<"${sums}")
          echo "sha256sums=${b64}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-sboms
          path: |
            out/tinkerbell-embedded-linux-amd64.spdx.json
            out/tinkerbell-embedded-linux-arm64.spdx.json
          if-no-files-found: error
          retention-days: 7

  attest-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build provenance attestation for the release assets.
      id-token: write
      attestations: write
    needs:
      - version
      - build
      - sbom-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the embedded binaries and their SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: embedded-*
          path: ./out
          merge-multiple: true

      - name: Check the release assets and write their checksums
        run: ./script/checksums.sh out/checksums-embedded.txt "${SHA256SUMS_AMD64}" "${SHA256SUMS_ARM64}" "${SHA256SUMS_SBOMS}"
        env:
          SHA256SUMS_AMD64: ${{ needs.build.outputs.sha256sums-embedded-amd64 }}
          SHA256SUMS_ARM64: ${{ needs.build.outputs.sha256sums-embedded-arm64 }}
          SHA256SUMS_SBOMS: ${{ needs.sbom-binaries.outputs.sha256sums }}

      # One SLSA provenance attestation whose subjects are the binaries, their
      # SBOMs and the checksums file, stored by GitHub and verified with
      # `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/tinkerbell-embedded-linux-amd64
            out/tinkerbell-embedded-linux-arm64
            out/tinkerbell-embedded-linux-amd64.spdx.json
            out/tinkerbell-embedded-linux-arm64.spdx.json
            out/checksums-embedded.txt

  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
      - sbom-binaries
      - sign
      - attest-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download the embedded binaries and their SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: embedded-*
          path: ./out
          merge-multiple: true

      # The same outputs give the same checksums file, so this publishes what
      # attest-binaries attested.
      - name: Check the release assets and write their checksums
        run: ./script/checksums.sh out/checksums-embedded.txt "${SHA256SUMS_AMD64}" "${SHA256SUMS_ARM64}" "${SHA256SUMS_SBOMS}"
        env:
          SHA256SUMS_AMD64: ${{ needs.build.outputs.sha256sums-embedded-amd64 }}
          SHA256SUMS_ARM64: ${{ needs.build.outputs.sha256sums-embedded-arm64 }}
          SHA256SUMS_SBOMS: ${{ needs.sbom-binaries.outputs.sha256sums }}

      # Artifact upload doesn't preserve permissions so we need to fix them.
      - name: Fix permissions
        run: chmod +x out/tinkerbell-embedded-linux-amd64 out/tinkerbell-embedded-linux-arm64

      - name: Publish Changelog to GitHub
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          draft: true
          prerelease: true
          artifacts: "out/tinkerbell-embedded-linux-amd64,out/tinkerbell-embedded-linux-arm64,out/tinkerbell-embedded-linux-amd64.spdx.json,out/tinkerbell-embedded-linux-arm64.spdx.json,out/checksums-embedded.txt"
